<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-itunes-app" content="app-id=6784749585">
  <title>TipLeague</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1410;
      color: #f5f5f5;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; width: 100%; }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.4px; }
    p { color: #b8c0b6; line-height: 1.45; }
    .code {
      margin: 24px 0;
      padding: 16px;
      border-radius: 16px;
      background: #1a211c;
      font-weight: 800;
      letter-spacing: 3px;
      font-size: 22px;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    a {
      display: block;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
    }
    .primary { background: #89F336; color: #111; }
    .secondary { color: #89F336; border: 1px solid #334; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TipLeague</h1>
    <p id="copy">Lade die App und tritt der Tipprunde bei.</p>
    <div id="codeBox" class="code" hidden></div>
    <div class="actions">
      <a id="open" class="primary" href="tipleague://join">In der App öffnen</a>
      <a id="store" class="secondary" href="https://apps.apple.com/app/id6784749585">App laden</a>
    </div>
  </div>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    const query = new URLSearchParams(location.search);
    let code = (query.get("code") || query.get("c") || "").trim();
    const joinIndex = parts.findIndex((p) => p.toLowerCase() === "join");
    if (!code && joinIndex >= 0 && parts[joinIndex + 1]) {
      code = parts[joinIndex + 1];
    }
    code = decodeURIComponent(code).trim().toUpperCase();

    const appUrl = code ? "tipleague://join/" + encodeURIComponent(code) : "tipleague://join";
    const playStore = "https://play.google.com/store/apps/details?id=com.tipleague";
    const appStore = "https://apps.apple.com/app/id6784749585";
    const isAndroid = /Android/i.test(navigator.userAgent || "");

    document.getElementById("open").href = appUrl;
    document.getElementById("store").href = isAndroid ? playStore : appStore;
    if (code) {
      document.getElementById("copy").textContent =
        "Tritt der Tipprunde bei. Wenn TipLeague installiert ist, öffnet sich die App.";
      const box = document.getElementById("codeBox");
      box.hidden = false;
      box.textContent = code;
    }
  </script>
</body>
</html>
